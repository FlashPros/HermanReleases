<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Herman Overlay</title>
    <style>
        * {
            background: none !important;
            box-shadow: none !important;
            border: none !important;
            outline: none !important;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* Social Media Widget */
        #social-widget {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            opacity: 0;
            transform: translateY(-20px);
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
            z-index: 1000;
            padding: 10px;
            border-radius: 8px;
        }

        #social-widget.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .platform-icon {
            width: 32px;
            height: 32px;
            object-fit: contain;
            background: none !important;
        }

        #displayText {
            font-size: 24px;
            font-weight: bold;
            white-space: nowrap;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            color: white;
            padding: 4px 12px;
            border-radius: 6px;
        }

        /* Sub Train Widget */
        #subtrain {
            position: fixed;
            top: 80px; /* Moved down to make room for social widget */
            right: 20px;
            background: rgba(0, 0, 0, 0.8) !important;
            padding: 15px;
            border-radius: 10px;
            color: white;
            display: none;
            opacity: 0;
            transform: translateX(20px);
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
        }

        #subtrain.visible {
            display: block;
            opacity: 1;
            transform: translateX(0);
        }

        .subtrain-stat {
            margin: 5px 0;
            font-size: 18px;
        }

        /* Giveaway Widget */
        #giveaway {
            position: fixed;
            top: 20px;
            left: 20px;
            transform: none;
            background: rgba(0, 0, 0, 0.9) !important;
            padding: 20px;
            border-radius: 15px;
            color: white;
            text-align: center;
            display: none;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            min-width: 300px;
        }

        #giveaway.visible {
            display: block;
            opacity: 1;
        }

        #giveaway-title {
            font-size: 24px;
            margin-bottom: 15px;
            color: #00ff00;
        }

        #giveaway-keyword {
            font-size: 20px;
            margin-bottom: 10px;
            color: #00ffff;
        }

        #giveaway-entries {
            font-size: 20px;
            margin-bottom: 10px;
        }

        #giveaway-winner {
            font-size: 28px;
            color: #ffff00;
            margin-top: 15px;
        }

        /* Intro Notification */
        #intro {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(100%);
            background: linear-gradient(135deg, #9146FF 0%, #6441A4 100%) !important;
            padding: 20px 30px;
            border-radius: 15px;
            color: white;
            text-align: center;
            display: none;
            opacity: 0;
            transition: transform 0.5s ease-out, opacity 0.5s ease-out;
            z-index: 9999;
        }

        #intro.visible {
            display: block;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            animation: introGlow 2s infinite;
        }

        #intro-text {
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            margin-bottom: 8px;
        }

        @keyframes introGlow {
            0% { box-shadow: 0 0 10px rgba(145, 70, 255, 0.5); }
            50% { box-shadow: 0 0 20px rgba(145, 70, 255, 0.8); }
            100% { box-shadow: 0 0 10px rgba(145, 70, 255, 0.5); }
        }

        /* Platform-specific themes */
        .twitch-theme #displayText {
            background: linear-gradient(135deg, #9146FF 0%, #6441A4 100%) !important;
            text-shadow: 
                2px 2px 4px rgba(0, 0, 0, 0.8),
                0 0 10px rgba(145, 70, 255, 0.8);
        }

        .youtube-theme #displayText {
            background: linear-gradient(135deg, #FF0000 0%, #CC0000 100%) !important;
            text-shadow: 
                2px 2px 4px rgba(0, 0, 0, 0.8),
                0 0 10px rgba(255, 0, 0, 0.8);
        }

        .tiktok-theme #displayText {
            background: linear-gradient(135deg, #000000 0%, #25F4EE 100%) !important;
            text-shadow: 
                2px 2px 4px rgba(0, 0, 0, 0.8),
                0 0 10px rgba(37, 244, 238, 0.8);
        }

        .instagram-theme #displayText {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%) !important;
            text-shadow: 
                2px 2px 4px rgba(0, 0, 0, 0.8),
                0 0 10px rgba(225, 48, 108, 0.8);
        }

        .twitch-theme .platform-icon { color: #9146FF; }
        .youtube-theme .platform-icon { color: #FF0000; }
        .tiktok-theme .platform-icon { color: #25F4EE; }
        .instagram-theme .platform-icon { color: #E1306C; }
    </style>
</head>
<body>
    <!-- Social Media Widget -->
    <div id="social-widget">
        <img id="platformIcon" class="platform-icon" src="" alt="Platform Icon">
        <span id="displayText"></span>
    </div>

    <!-- Sub Train Widget -->
    <div id="subtrain">
        <div class="subtrain-stat">Total Subs: <span id="totalSubs">0</span></div>
        <div class="subtrain-stat">Gifted Subs: <span id="giftedSubs">0</span></div>
        <div class="subtrain-stat">Regular Subs: <span id="regularSubs">0</span></div>
        <div class="subtrain-stat">Highest Count: <span id="highestSubCount">0</span></div>
    </div>

    <!-- Giveaway Widget -->
    <div id="giveaway">
        <div id="giveaway-title">Giveaway Title</div>
        <div id="giveaway-keyword">Keyword: !item</div>
        <div id="giveaway-entries">Entries: 0</div>
        <div id="giveaway-winner"></div>
    </div>

    <!-- Intro Notification -->
    <div id="intro">
        <div id="intro-text">Welcome!</div>
    </div>

    <script>
        // Auto-refresh settings
        const AUTO_REFRESH_INTERVAL = 600000;  // 10 minutes
        const MIN_REFRESH_INTERVAL = 300000;   // 5 minutes (if everything is good)
        const MAX_REFRESH_INTERVAL = 1800000;  // 30 minutes (maximum backoff)
        let currentRefreshInterval = AUTO_REFRESH_INTERVAL;
        let lastModified = null;
        let updateCheckTimer = null;
        let consecutiveErrors = 0;

        // Function to check for updates
        async function checkForUpdates() {
            try {
                const response = await fetch(window.location.href, { 
                    method: 'HEAD',
                    cache: 'no-store'
                });

                // Handle rate limiting
                if (response.status === 429) {
                    console.log('Rate limit hit, backing off...');
                    increaseRefreshInterval();
                    return;
                }

                // Reset interval if successful
                if (response.ok) {
                    consecutiveErrors = 0;
                    currentRefreshInterval = AUTO_REFRESH_INTERVAL;
                }

                const currentModified = response.headers.get('last-modified');
                
                if (lastModified && lastModified !== currentModified) {
                    console.log('Update detected, refreshing page...');
                    window.location.reload();
                }
                
                lastModified = currentModified;
            } catch (error) {
                console.error('Error checking for updates:', error);
                increaseRefreshInterval();
            }

            // Schedule next check
            scheduleNextCheck();
        }

        // Function to increase refresh interval with exponential backoff
        function increaseRefreshInterval() {
            consecutiveErrors++;
            // More aggressive backoff but shorter maximum
            const backoffMultiplier = Math.min(Math.pow(2, consecutiveErrors), 3); // Max 3x longer
            currentRefreshInterval = Math.min(AUTO_REFRESH_INTERVAL * backoffMultiplier, MAX_REFRESH_INTERVAL);
            console.log(`Increased refresh interval to ${currentRefreshInterval/1000} seconds`);
        }

        // Function to schedule next check
        function scheduleNextCheck() {
            if (updateCheckTimer) {
                clearTimeout(updateCheckTimer);
            }
            updateCheckTimer = setTimeout(checkForUpdates, currentRefreshInterval);
        }

        // Initial check and setup
        checkForUpdates();

        // WebSocket connection
        let ws = null;
        let reconnectAttempts = 0;
        const maxReconnectAttempts = 5;
        const defaultPorts = [1337, 1338]; // Release and Debug ports
        let currentPortIndex = 0;

        // Social media rotation settings
        const DISPLAY_DURATION = 8000;  // 8 seconds display time
        const HIDE_DURATION = 1500;     // 1.5 seconds transition time
        const COMPLETE_CYCLE_PAUSE = 900000; // 15 minutes pause between cycles
        let socialMediaQueue = [];
        let currentSocialIndex = 0;
        let isRotating = false;
        let rotationTimeout = null;
        let hideTimeout = null;
        let cycleTimeout = null;

        function connectWebSocket() {
            const port = defaultPorts[currentPortIndex];
            ws = new WebSocket(`ws://localhost:${port}?token=Hermanapitest`);

            ws.onopen = () => {
                console.log('Connected to WebSocket on port', port);
                reconnectAttempts = 0;
                
                // Subscribe to events
                ws.send(JSON.stringify({
                    subscribe: [
                        'WIDGET_UPDATE',
                        'WIDGET_VISIBILITY',
                        'SOCIAL_LINKS_UPDATED',
                        'TEST_EVENT',
                        'START_ROTATION',
                        'SUBTRAIN_UPDATE',
                        'GIVEAWAY_START',
                        'GIVEAWAY_UPDATE',
                        'GIVEAWAY_END',
                        'INTRO_NOTIFICATION',
                        'force_refresh'
                    ]
                }));
            };

            ws.onclose = () => {
                console.log('WebSocket connection closed');
                if (reconnectAttempts < maxReconnectAttempts) {
                    reconnectAttempts++;
                    currentPortIndex = (currentPortIndex + 1) % defaultPorts.length;
                    setTimeout(connectWebSocket, 1000);
                }
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                console.log('Received message:', data);

                switch (data.event) {
                    case 'force_refresh':
                        console.log('Received force refresh command, reloading page...');
                        window.location.reload();
                        break;

                    case 'SOCIAL_LINKS_UPDATED':
                        if (data.data && Array.isArray(data.data)) {
                            socialMediaQueue = data.data.map(link => ({
                                platform: link.platform.toLowerCase(),
                                text: link.display_text || link.call_to_action
                            }));
                            if (!isRotating) {
                                startRotation();
                            }
                        }
                        break;

                    case 'START_ROTATION':
                        if (!isRotating) {
                            startRotation();
                        }
                        break;

                    case 'SUBTRAIN_UPDATE':
                        updateSubTrain(data.data);
                        break;

                    case 'GIVEAWAY_START':
                        showGiveaway(data.data);
                        break;

                    case 'GIVEAWAY_UPDATE':
                        updateGiveaway(data.data);
                        break;

                    case 'GIVEAWAY_END':
                        hideGiveaway();
                        break;

                    case 'INTRO_NOTIFICATION':
                        showIntroNotification(data.data);
                        break;
                }
            };
        }

        function updateSubTrain(data) {
            document.getElementById('totalSubs').textContent = data.totalSubs;
            document.getElementById('giftedSubs').textContent = data.giftedSubs;
            document.getElementById('regularSubs').textContent = data.regularSubs;
            document.getElementById('highestSubCount').textContent = data.highestCount;
            
            const subtrainElement = document.getElementById('subtrain');
            if (data.isVisible) {
                subtrainElement.classList.add('visible');
            } else {
                subtrainElement.classList.remove('visible');
            }
        }

        function showGiveaway(data) {
            const giveawayElement = document.getElementById('giveaway');
            document.getElementById('giveaway-title').textContent = data.title;
            document.getElementById('giveaway-keyword').textContent = `Keyword: ${data.keyword}`;
            document.getElementById('giveaway-entries').textContent = `Entries: ${data.entries}`;
            document.getElementById('giveaway-winner').textContent = '';
            giveawayElement.classList.add('visible');
        }

        function updateGiveaway(data) {
            document.getElementById('giveaway-entries').textContent = `Entries: ${data.entries}`;
            if (data.winner) {
                document.getElementById('giveaway-winner').textContent = `Winner: ${data.winner}`;
            }
        }

        function hideGiveaway() {
            document.getElementById('giveaway').classList.remove('visible');
        }

        function showIntroNotification(data) {
            const introElement = document.getElementById('intro');
            document.getElementById('intro-text').textContent = `Welcome ${data.username}!`;
            introElement.classList.add('visible');
            
            setTimeout(() => {
                introElement.classList.remove('visible');
            }, 5000);
        }

        function updateSocialWidget(platform, text) {
            const socialWidget = document.getElementById('social-widget');
            const platformIcon = document.getElementById('platformIcon');
            const displayText = document.getElementById('displayText');

            // Remove all theme classes and add new theme
            socialWidget.className = 'social-widget';  // Reset to base class
            socialWidget.classList.add(`${platform}-theme`);

            // Set the icon - make sure platform is lowercase and handle all cases
            const iconName = platform.toLowerCase();
            platformIcon.src = `../images/${iconName}-icon.png`;  // Updated path
            platformIcon.alt = `${platform} Icon`;
            platformIcon.className = 'platform-icon';
            
            // Set the text
            displayText.textContent = text;

            // Show the widget
            socialWidget.classList.add('visible');

            // Log for debugging
            console.log('Updating social widget:', {
                platform,
                iconPath: platformIcon.src,
                text,
                classes: socialWidget.className
            });
        }

        function hideSocialWidget() {
            const socialWidget = document.getElementById('social-widget');
            socialWidget.classList.remove('visible');
        }

        function startRotation() {
            if (socialMediaQueue.length === 0) return;

            isRotating = true;
            showNextSocial();
        }

        function showNextSocial() {
            if (currentSocialIndex >= socialMediaQueue.length) {
                currentSocialIndex = 0;
                isRotating = false;
                
                // Wait for COMPLETE_CYCLE_PAUSE before starting the next cycle
                cycleTimeout = setTimeout(() => {
                    startRotation();
                }, COMPLETE_CYCLE_PAUSE);
                
                return;
            }

            const current = socialMediaQueue[currentSocialIndex];
            updateSocialWidget(current.platform, current.text);

            // Schedule hide
            hideTimeout = setTimeout(() => {
                hideSocialWidget();
                
                // Schedule next show
                rotationTimeout = setTimeout(() => {
                    currentSocialIndex++;
                    showNextSocial();
                }, HIDE_DURATION);
            }, DISPLAY_DURATION);
        }

        // Initial connection
        connectWebSocket();
    </script>
</body>
</html>
