<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Herman Overlay</title>
    <style>
        * {
            background: none !important;
            box-shadow: none !important;
            border: none !important;
            outline: none !important;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* Social Media Widget */
        #social-widget {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
            z-index: 1000;
        }

        #social-widget.visible {
            opacity: 1;
            transform: translateY(0);
        }

        #platformIcon {
            width: 32px;
            height: 32px;
            background: none !important;
        }

        #displayText {
            font-size: 24px;
            font-weight: bold;
            white-space: nowrap;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            color: white;
            padding: 4px 12px;
            border-radius: 6px;
        }

        /* Sub Train Widget */
        #subtrain {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8) !important;
            padding: 15px;
            border-radius: 10px;
            color: white;
            display: none;
            opacity: 0;
            transform: translateX(20px);
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
        }

        #subtrain.visible {
            display: block;
            opacity: 1;
            transform: translateX(0);
        }

        .subtrain-stat {
            margin: 5px 0;
            font-size: 18px;
        }

        /* Giveaway Widget */
        #giveaway {
            position: fixed;
            top: 20px;
            left: 20px;
            transform: none;
            background: rgba(0, 0, 0, 0.9) !important;
            padding: 20px;
            border-radius: 15px;
            color: white;
            text-align: center;
            display: none;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            min-width: 300px;
        }

        #giveaway.visible {
            display: block;
            opacity: 1;
        }

        #giveaway-title {
            font-size: 24px;
            margin-bottom: 15px;
            color: #00ff00;
        }

        #giveaway-keyword {
            font-size: 20px;
            margin-bottom: 10px;
            color: #00ffff;
        }

        #giveaway-entries {
            font-size: 20px;
            margin-bottom: 10px;
        }

        #giveaway-winner {
            font-size: 28px;
            color: #ffff00;
            margin-top: 15px;
        }

        /* Intro Notification */
        #intro {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(100%);
            background: linear-gradient(135deg, #9146FF 0%, #6441A4 100%) !important;
            padding: 20px 30px;
            border-radius: 15px;
            color: white;
            text-align: center;
            display: none;
            opacity: 0;
            transition: transform 0.5s ease-out, opacity 0.5s ease-out;
            z-index: 9999;
        }

        #intro.visible {
            display: block;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            animation: introGlow 2s infinite;
        }

        #intro-text {
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            margin-bottom: 8px;
        }

        @keyframes introGlow {
            0% { box-shadow: 0 0 10px rgba(145, 70, 255, 0.5); }
            50% { box-shadow: 0 0 20px rgba(145, 70, 255, 0.8); }
            100% { box-shadow: 0 0 10px rgba(145, 70, 255, 0.5); }
        }

        /* Platform-specific themes */
        .twitch-theme #displayText {
            background: linear-gradient(135deg, #9146FF 0%, #6441A4 100%) !important;
            text-shadow: 
                2px 2px 4px rgba(0, 0, 0, 0.8),
                0 0 10px rgba(145, 70, 255, 0.8);
        }

        .youtube-theme #displayText {
            background: linear-gradient(135deg, #FF0000 0%, #CC0000 100%) !important;
            text-shadow: 
                2px 2px 4px rgba(0, 0, 0, 0.8),
                0 0 10px rgba(255, 0, 0, 0.8);
        }

        .tiktok-theme #displayText {
            background: linear-gradient(135deg, #000000 0%, #25F4EE 100%) !important;
            text-shadow: 
                2px 2px 4px rgba(0, 0, 0, 0.8),
                0 0 10px rgba(37, 244, 238, 0.8);
        }

        .instagram-theme #displayText {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%) !important;
            text-shadow: 
                2px 2px 4px rgba(0, 0, 0, 0.8),
                0 0 10px rgba(225, 48, 108, 0.8);
        }

        .platform-icon {
            width: 32px;
            height: 32px;
            fill: currentColor;
        }

        .twitch-theme .platform-icon { color: #9146FF; }
        .youtube-theme .platform-icon { color: #FF0000; }
        .tiktok-theme .platform-icon { color: #25F4EE; }
        .instagram-theme .platform-icon { color: #E1306C; }

        /* Animations */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .pulse {
            animation: pulse 0.5s ease;
        }
    </style>
</head>
<body>

        </svg>
    </div>

    <!-- Social Media Widget -->
    <div id="social-widget">
        <svg id="platformIcon" class="platform-icon" viewBox="0 0 24 24"></svg>
        <span id="displayText"></span>
    </div>

    <!-- Sub Train Widget -->
    <div id="subtrain">
        <div class="subtrain-stat">Total Subs: <span id="totalSubs">0</span></div>
        <div class="subtrain-stat">Gifted Subs: <span id="giftedSubs">0</span></div>
        <div class="subtrain-stat">Regular Subs: <span id="regularSubs">0</span></div>
        <div class="subtrain-stat">Highest Count: <span id="highestSubCount">0</span></div>
    </div>

    <!-- Giveaway Widget -->
    <div id="giveaway">
        <div id="giveaway-title">Giveaway Title</div>
        <div id="giveaway-keyword">Keyword: !item</div>
        <div id="giveaway-entries">Entries: 0</div>
        <div id="giveaway-winner"></div>
    </div>

    <!-- Intro Notification -->
    <div id="intro">
        <div id="intro-text">Welcome!</div>
    </div>

    <script>
        // Element references
        const socialWidget = document.getElementById('social-widget');
        const platformIcon = document.getElementById('platformIcon');
        const displayText = document.getElementById('displayText');
        const subtrain = document.getElementById('subtrain');
        const totalSubs = document.getElementById('totalSubs');
        const giftedSubs = document.getElementById('giftedSubs');
        const regularSubs = document.getElementById('regularSubs');
        const highestSubCount = document.getElementById('highestSubCount');
        const giveaway = document.getElementById('giveaway');
        const giveawayTitle = document.getElementById('giveaway-title');
        const giveawayKeyword = document.getElementById('giveaway-keyword');
        const giveawayEntries = document.getElementById('giveaway-entries');
        const giveawayWinner = document.getElementById('giveaway-winner');
        const intro = document.getElementById('intro');
        const introText = document.getElementById('intro-text');

        // WebSocket connection
        let ws = null;
        let reconnectAttempts = 0;
        const maxReconnectAttempts = 5;
        const defaultPorts = [1337, 1338]; // Release and Debug ports
        let currentPortIndex = 0;

        // Social media rotation settings
        const DISPLAY_DURATION = 8000;  // 8 seconds display time
        const HIDE_DURATION = 1500;     // 1.5 seconds transition time
        const COMPLETE_CYCLE_PAUSE = 900000; // 15 minutes pause between cycles (15 * 60 * 1000)
        let socialMediaQueue = [];
        let currentSocialIndex = 0;
        let isRotating = false;
        let rotationTimeout = null;
        let hideTimeout = null;
        let cycleTimeout = null;

        // Initialize default social media links
        const defaultLinks = [
            {
                platform: 'Twitch',
                display_text: 'Follow Here: EdEMonster'
            },
            {
                platform: 'YouTube',
                display_text: 'Subscribe Here: EdEMonsterGames'
            },
            {
                platform: 'TikTok',
                display_text: 'Follow Here: EdEMonsterGames'
            },
            {
                platform: 'Instagram',
                display_text: 'Follow Here: EdEMonster'
            }
        ];

        function connectWebSocket() {
            const urlParams = new URLSearchParams(window.location.search);
            const specifiedPort = urlParams.get('port');
            const port = specifiedPort || defaultPorts[currentPortIndex];
            const token = urlParams.get('token') || 'Hermanapitest';

            ws = new WebSocket(`ws://localhost:${port}?token=${token}`);

            ws.onopen = () => {
                console.log('Connected to WebSocket on port', port);
                reconnectAttempts = 0;
                
                // Subscribe to events
                ws.send(JSON.stringify({
                    subscribe: [
                        'WIDGET_UPDATE',
                        'WIDGET_VISIBILITY',
                        'SOCIAL_LINKS_UPDATED',
                        'TEST_EVENT',
                        'START_ROTATION',
                        'SUBTRAIN_UPDATE',
                        'GIVEAWAY_START',
                        'GIVEAWAY_UPDATE',
                        'GIVEAWAY_END',
                        'INTRO_NOTIFICATION'
                    ]
                }));
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    handleWebSocketMessage(data);
                } catch (error) {
                    console.error('Error parsing WebSocket message:', error);
                }
            };

            ws.onclose = () => {
                console.log('WebSocket connection closed');
                stopSocialRotation();
                
                if (!specifiedPort && currentPortIndex < defaultPorts.length - 1) {
                    currentPortIndex++;
                    console.log('Trying next port:', defaultPorts[currentPortIndex]);
                    setTimeout(connectWebSocket, 1000);
                } else if (reconnectAttempts < maxReconnectAttempts) {
                    currentPortIndex = 0;
                    reconnectAttempts++;
                    const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), 30000);
                    console.log('Reconnecting in', delay, 'ms');
                    setTimeout(connectWebSocket, delay);
                }
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };
        }

        function handleWebSocketMessage(data) {
            console.log('Received WebSocket message:', data);

            switch (data.event) {
                case 'SOCIAL_LINKS_UPDATED':
                    if (data.data && data.data.length > 0) {
                        socialMediaQueue = data.data.map(link => ({
                            platform: link.platform,
                            display_text: link.call_to_action
                        }));
                        if (!isRotating) {
                            startSocialRotation(false);
                        }
                    }
                    break;

                case 'WIDGET_VISIBILITY':
                    if (data.data && data.data.visible) {
                        startSocialRotation(false);
                    } else {
                        stopSocialRotation();
                    }
                    break;

                case 'TEST_EVENT':
                    // Use default links for test event
                    socialMediaQueue = defaultLinks;
                    startSocialRotation(true);
                    break;

                case 'START_ROTATION':
                    if (socialMediaQueue.length === 0) {
                        socialMediaQueue = defaultLinks;
                    }
                    startSocialRotation(false);
                    break;

                case 'SUBTRAIN_UPDATE':
                    if (data.data) {
                        updateSubtrain(data.data);
                    }
                    break;

                case 'GIVEAWAY_START':
                    if (data.data) {
                        startGiveaway(data.data);
                    }
                    break;

                case 'GIVEAWAY_UPDATE':
                    if (data.data) {
                        updateGiveaway(data.data);
                    }
                    break;

                case 'GIVEAWAY_END':
                    if (data.data) {
                        endGiveaway(data.data);
                    }
                    break;

                case 'INTRO_NOTIFICATION':
                    if (data.data) {
                        showIntro(data.data);
                    }
                    break;
            }
        }

        function updateSocialWidget(platform, displayText) {
            const sourceIcon = document.getElementById(`${platform.toLowerCase()}-icon`);
            if (sourceIcon) {
                platformIcon.innerHTML = sourceIcon.innerHTML;
            }

            displayText.textContent = displayText;
            socialWidget.className = `${platform.toLowerCase()}-theme`;
            socialWidget.classList.add('visible');
        }

        function stopSocialRotation() {
            isRotating = false;
            clearTimeout(rotationTimeout);
            clearTimeout(hideTimeout);
            clearTimeout(cycleTimeout);
            rotationTimeout = hideTimeout = cycleTimeout = null;
            socialWidget.classList.remove('visible');
        }

        function startSocialRotation(isTestMode = false) {
            stopSocialRotation();
            if (socialMediaQueue.length === 0) return;
            
            isRotating = true;
            currentSocialIndex = 0;
            rotateSocialMedia(isTestMode);
        }

        function rotateSocialMedia(isTestMode = false) {
            if (!isRotating || socialMediaQueue.length === 0) {
                stopSocialRotation();
                return;
            }

            const currentLink = socialMediaQueue[currentSocialIndex];
            if (!currentLink) {
                stopSocialRotation();
                return;
            }

            updateSocialWidget(currentLink.platform, currentLink.display_text);

            hideTimeout = setTimeout(() => {
                socialWidget.classList.remove('visible');

                rotationTimeout = setTimeout(() => {
                    currentSocialIndex = (currentSocialIndex + 1) % socialMediaQueue.length;
                    
                    if (currentSocialIndex === 0) {
                        cycleTimeout = setTimeout(() => {
                            rotateSocialMedia(false);
                        }, COMPLETE_CYCLE_PAUSE);
                    } else {
                        rotateSocialMedia(false);
                    }
                }, HIDE_DURATION);
            }, DISPLAY_DURATION);
        }

        function updateSubtrain(data) {
            totalSubs.textContent = data.totalSubs;
            giftedSubs.textContent = data.giftedSubs;
            regularSubs.textContent = data.regularSubs;
            highestSubCount.textContent = data.trainHighest;

            const statsToAnimate = [
                { element: totalSubs, newValue: data.totalSubs },
                { element: giftedSubs, newValue: data.giftedSubs },
                { element: regularSubs, newValue: data.regularSubs },
                { element: highestSubCount, newValue: data.trainHighest }
            ];

            statsToAnimate.forEach(stat => {
                if (stat.element.textContent !== stat.newValue.toString()) {
                    stat.element.classList.remove('pulse');
                    void stat.element.offsetWidth; // Force reflow
                    stat.element.classList.add('pulse');
                }
            });

            subtrain.classList.add('visible');
        }

        function startGiveaway(data) {
            giveawayTitle.textContent = data.title;
            giveawayKeyword.textContent = `Keyword: ${data.keyword}`;
            giveawayEntries.textContent = `Entries: ${data.entries}`;
            giveawayWinner.textContent = '';
            giveaway.classList.add('visible');
        }

        function updateGiveaway(data) {
            giveawayEntries.textContent = `Entries: ${data.entries}`;
        }

        function endGiveaway(data) {
            if (data.winner) {
                giveawayWinner.textContent = `Winner: ${data.winner}`;
                setTimeout(() => giveaway.classList.remove('visible'), 5000);
            } else {
                giveaway.classList.remove('visible');
            }
        }

        function showIntro(data) {
            introText.textContent = `Welcome, ${data.username}!`;
            intro.classList.add('visible');
            
            // If duration is provided, use it, otherwise default to 5 seconds
            const duration = (data.duration || 5) * 1000;
            setTimeout(() => {
                intro.classList.remove('visible');
            }, duration);
        }

        // Initial connection
        connectWebSocket();
    </script>
</body>
